name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[test]"

      - name: Run regression tests
        run: pytest -q

      - name: Live-check Cinema Online parser
        run: python scripts/run_cinema_online.py

      # Temporary P1 discovery step. Remove after the Cinepoint collector lands.
      - name: Verify Cinepoint weekly API path
        run: |
          python - <<'PY'
          import requests

          headers = {"User-Agent": "Mozilla/5.0"}
          base = "https://cinepoint.com/bff/v1/movies/top-box-office"
          queries = {
              "daily-list": f"{base}/daily?date_end=2026-08-13&type=all&sub_period=month&page=0&limit=10",
              "weekly-list": f"{base}/weekly?date_end=2026-08-13&type=all&sub_period=month&page=0&limit=10",
              "weekly-detail": f"{base}/weekly/detail?date_start=2026-08-10&date_end=2026-08-16&type=all&limit=10",
              "monthly-list": f"{base}/monthly?date_end=2026-08-13&type=all&page=0&limit=10",
              "yearly-list": f"{base}/yearly?date_end=2026-08-13&type=all&page=0&limit=10",
          }
          for name, url in queries.items():
              response = requests.get(url, timeout=(10, 45), headers=headers)
              print(name, response.status_code, response.headers.get("content-type"), len(response.content))
              print(response.text[:3000])
          PY

      - name: Upload failed raw source for parser repair
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-raw-source
          path: data/raw/**/failures/**
          if-no-files-found: ignore
          retention-days: 14
