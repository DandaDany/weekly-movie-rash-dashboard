name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[test,browser]"

      - name: Run regression tests
        run: pytest -q

      - name: Live-check Malaysia + Singapore
        run: python scripts/run_cinema_online.py

      - name: Live-check Indonesia
        run: python scripts/run_cinepoint.py

      - name: Verify Box Office Vietnam in normal Chrome
        run: |
          python - <<'PY'
          import json
          from playwright.sync_api import sync_playwright

          out = {}
          with sync_playwright() as p:
              browser = p.chromium.launch(channel="chrome", headless=True)
              page = browser.new_page(
                  viewport={"width": 1440, "height": 1600},
                  locale="vi-VN",
                  timezone_id="Asia/Ho_Chi_Minh",
              )
              response = page.goto("https://v1.boxofficevietnam.com/", wait_until="domcontentloaded", timeout=90000)
              page.wait_for_timeout(5000)
              out["status"] = response.status if response else None
              out["url"] = page.url
              out["title"] = page.title()
              out["body_head"] = page.locator("body").inner_text()[:5000]

              heading = page.get_by_text("Doanh Thu Cuối Tuần", exact=True)
              out["heading_count"] = heading.count()
              tables = page.locator("table")
              out["table_count"] = tables.count()
              found = []
              for i in range(tables.count()):
                  table = tables.nth(i)
                  text = table.inner_text()
                  if all(token in text for token in ["Tên Phim", "Doanh thu", "Vé", "Suất chiếu"]):
                      rows = table.locator("tr")
                      found.append({
                          "index": i,
                          "rows": rows.count(),
                          "text": text[:16000],
                          "html": table.evaluate("el => el.outerHTML")[:30000],
                      })
              out["candidate_tables"] = found

              date_inputs = []
              for selector in ["input", "select", "option"]:
                  loc = page.locator(selector)
                  for i in range(loc.count()):
                      el = loc.nth(i)
                      attrs = el.evaluate("el => ({id:el.id,name:el.name,value:el.value,type:el.type,className:el.className,outer:el.outerHTML})")
                      s = str(attrs).lower()
                      if any(k in s for k in ["date", "week", "start", "end", "from", "to"]):
                          date_inputs.append(attrs)
              out["date_inputs"] = date_inputs[:100]
              browser.close()

          with open("vietnam-browser-probe.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, indent=2)
          print("VN_BROWSER", out.get("status"), "heading", out.get("heading_count"), "tables", len(out.get("candidate_tables", [])))
          PY

      - name: Upload Vietnam browser probe
        uses: actions/upload-artifact@v4
        with:
          name: vietnam-browser-probe
          path: vietnam-browser-probe.json
          retention-days: 3

      - name: Upload failed raw source for parser repair
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-raw-source
          path: data/raw/**/failures/**
          if-no-files-found: ignore
          retention-days: 14
