name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[test,browser]"

      - name: Run regression tests
        run: pytest -q

      - name: Run all source collectors
        run: python scripts/run_all.py

      - name: Dashboard smoke test
        run: |
          python -m http.server 8765 --directory public >/tmp/dashboard.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch(channel="chrome", headless=True)
              page = browser.new_page(viewport={"width": 1440, "height": 1200})
              page.goto("http://127.0.0.1:8765/", wait_until="networkidle", timeout=30000)

              assert page.locator(".market-tab").count() == 6
              page.locator("tbody tr").first.wait_for(timeout=10000)
              assert page.locator("tbody tr").count() == 10
              assert "印尼票房排行" in page.locator("#marketTitle").inner_text()
              id_headers = page.locator("thead").inner_text()
              assert "本期人次" in id_headers
              assert "場次" in id_headers
              assert "累計人次" in id_headers

              page.locator('[data-market="TW"]').click()
              tw_rows = page.locator("tbody tr").count()
              if tw_rows:
                  assert tw_rows >= 5
                  assert "台灣票房排行" in page.locator("#marketTitle").inner_text()
                  assert "本期票房" in page.locator("thead").inner_text()
              else:
                  page.locator("#emptyState").wait_for(state="visible", timeout=5000)
                  assert "自動更新尚未接通" in page.locator("#emptyState").inner_text()

              page.locator('[data-market="VN"]').click()
              vn_rows = page.locator("tbody tr").count()
              if vn_rows:
                  assert vn_rows >= 5
                  assert "越南票房排行" in page.locator("#marketTitle").inner_text()
                  vn_headers = page.locator("thead").inner_text()
                  assert "本期票房" in vn_headers
                  assert "本期人次" in vn_headers
                  assert "場次" in vn_headers
              else:
                  page.locator("#emptyState").wait_for(state="visible", timeout=5000)
                  assert "自動更新尚未接通" in page.locator("#emptyState").inner_text()

              page.locator('[data-market="MY"]').click()
              page.locator("tbody tr").first.wait_for(timeout=5000)
              assert page.locator("tbody tr").count() == 10
              my_headers = page.locator("thead").inner_text()
              assert "上週" in my_headers
              assert "上映日" in my_headers
              browser.close()
          PY

      - name: Verify source status contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(Path("public/data/status.json").read_text(encoding="utf-8"))

          for collector in ("taiwan", "vietnam"):
              item = status[collector]
              assert item["availability"] in {"live", "unavailable"}, item
              if item["availability"] == "live":
                  assert item["success"] is True
                  assert item["records"] >= 5
              else:
                  assert item["success"] is False
                  assert item["reason"] == "access_blocked", item

          hong_kong = status["hong_kong"]
          assert hong_kong["availability"] == "unavailable", hong_kong
          assert hong_kong["success"] is False

          assert status["cinema_online"]["availability"] == "live"
          assert status["cinepoint"]["availability"] == "live"
          PY

      - name: Upload live data preview
        uses: actions/upload-artifact@v4
        with:
          name: live-data-preview
          path: |
            public/data/**
            data/history/boxoffice.csv
            data/meta/crawl_status/**
            data/raw/**
          retention-days: 3

      - name: Upload failed raw source for parser repair
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-raw-source
          path: data/raw/**/failures/**
          if-no-files-found: ignore
          retention-days: 14
