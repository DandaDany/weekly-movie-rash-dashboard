name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[test]"

      - name: Run regression tests
        run: pytest -q

      - name: Live-check Cinema Online parser
        run: python scripts/run_cinema_online.py

      # Temporary P1 discovery step. Remove after the Cinepoint collector lands.
      - name: Probe Cinepoint weekly API response
        run: |
          python - <<'PY'
          import requests

          url = "https://cinepoint.com/bff/v1/movies/top-box-office/weekly"
          headers = {
              "User-Agent": "Mozilla/5.0",
              "Accept": "application/json",
              "Referer": "https://cinepoint.com/",
          }
          candidates = [
              {},
              {"page": 0, "size": 20},
              {"page": 1, "limit": 20},
              {"page": 1, "per_page": 20},
          ]
          for params in candidates:
              response = requests.get(url, params=params, headers=headers, timeout=(10, 30))
              print("REQUEST", response.url)
              print("STATUS", response.status_code, "TYPE", response.headers.get("content-type"), "LEN", len(response.content))
              print(response.text[:8000])
              print("---")
          PY

      - name: Upload failed raw source for parser repair
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-raw-source
          path: data/raw/**/failures/**
          if-no-files-found: ignore
          retention-days: 14
