name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[test,browser]"

      - name: Run regression tests
        run: pytest -q

      - name: Live-check Malaysia + Singapore
        run: python scripts/run_cinema_online.py

      - name: Live-check Indonesia
        run: python scripts/run_cinepoint.py

      - name: Probe HKTDC weekly box office endpoint
        run: |
          python - <<'PY'
          import json
          import re
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          url = "https://hkfilmart.hktdc.com/conference/hkfilmart/en/hong-kong-weekly-box-office"
          H = {"User-Agent": "Mozilla/5.0", "Accept": "text/html,application/json,*/*"}
          r = requests.get(url, headers=H, timeout=(10, 45))
          r.raise_for_status()
          soup = BeautifulSoup(r.text, "html.parser")
          out = {
              "url": r.url,
              "status": r.status_code,
              "content_type": r.headers.get("content-type"),
              "length": len(r.content),
              "body_text": " ".join(soup.stripped_strings)[:12000],
              "scripts": [],
              "inline_hits": [],
              "script_hits": [],
          }

          needles = re.compile(r"box.?office|weekly|gross|film.?title|release.?date|api|graphql|json", re.I)
          for tag in soup.find_all("script"):
              if tag.get("src"):
                  src = urljoin(r.url, tag.get("src"))
                  out["scripts"].append(src)
              else:
                  text = tag.string or tag.get_text(" ")
                  if text and needles.search(text):
                      out["inline_hits"].append(text[:30000])

          for src in out["scripts"]:
              try:
                  js = requests.get(src, headers=H, timeout=(10, 30))
                  if js.status_code != 200:
                      continue
                  text = js.text
                  matches = list(needles.finditer(text))
                  if not matches:
                      continue
                  snippets = []
                  for m in matches[:40]:
                      pos = m.start()
                      snippets.append(text[max(0,pos-700):pos+1800])
                  out["script_hits"].append({"url": src, "snippets": snippets})
              except Exception as exc:
                  out["script_hits"].append({"url": src, "error": f"{type(exc).__name__}: {exc}"})

          with open("hongkong-probe.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, indent=2)
          print("HK", r.status_code, "len", len(r.content), "scripts", len(out["scripts"]), "hits", len(out["script_hits"]))
          PY

      - name: Upload Hong Kong probe
        uses: actions/upload-artifact@v4
        with:
          name: hongkong-probe
          path: hongkong-probe.json
          retention-days: 3

      - name: Upload failed raw source for parser repair
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-raw-source
          path: data/raw/**/failures/**
          if-no-files-found: ignore
          retention-days: 14
