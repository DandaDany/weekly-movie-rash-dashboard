name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[test]"

      - name: Run regression tests
        run: pytest -q

      - name: Live-check Cinema Online parser
        run: python scripts/run_cinema_online.py

      # Temporary P1 discovery step. Remove after the Cinepoint collector lands.
      - name: Locate Cinepoint MovieService endpoint builder
        run: |
          python - <<'PY'
          import re
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from urllib.parse import urljoin
          import requests

          headers = {"User-Agent": "Mozilla/5.0"}
          root_url = "https://cinepoint.com/chunk-Q6ECZFTZ.js"
          root = requests.get(root_url, timeout=(10, 30), headers=headers)
          root.raise_for_status()
          root_text = root.text
          imports = sorted(set(re.findall(r'from["\'](\./[^"\']+\.js)["\']', root_text)))
          print("ROOT_IMPORTS", imports)

          def fetch(path):
              url = urljoin(root_url, path)
              try:
                  response = requests.get(url, timeout=(5, 15), headers=headers)
                  return path, response.status_code, response.text if response.status_code == 200 else ""
              except Exception as exc:
                  return path, 0, f"ERROR {type(exc).__name__}: {exc}"

          with ThreadPoolExecutor(max_workers=8) as pool:
              futures = [pool.submit(fetch, path) for path in imports]
              for future in as_completed(futures):
                  path, status, text = future.result()
                  print("FETCH", path, status, len(text))
                  for needle in ("getTopBoxOfficePage", "getTopBoxOfficeDetail"):
                      if needle not in text:
                          continue
                      print("FOUND", needle, "IN", path)
                      start = 0
                      while True:
                          index = text.find(needle, start)
                          if index < 0:
                              break
                          print(text[max(0, index - 1600): index + 2600])
                          start = index + len(needle)
          PY

      - name: Upload failed raw source for parser repair
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-raw-source
          path: data/raw/**/failures/**
          if-no-files-found: ignore
          retention-days: 14
