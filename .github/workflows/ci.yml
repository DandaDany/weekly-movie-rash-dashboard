name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[test]"

      - name: Run regression tests
        run: pytest -q

      - name: Live-check Cinema Online parser
        run: python scripts/run_cinema_online.py

      # Temporary P1 discovery step. Remove after the Cinepoint collector lands.
      - name: Verify Cinepoint browser-equivalent weekly query
        run: |
          python - <<'PY'
          import requests

          url = "https://cinepoint.com/bff/v1/home/box-office/weekly"
          headers = {
              "User-Agent": "Mozilla/5.0",
              "Accept": "application/json",
              "Referer": "https://cinepoint.com/",
          }
          params = {
              "limit": 10,
              "page": 0,
              "type": "all",
              "spinneroff": "1",
          }
          r = requests.get(url, params=params, headers=headers, timeout=(10, 30))
          print("REQUEST", r.url)
          print("STATUS", r.status_code, "TYPE", r.headers.get("content-type"), "LEN", len(r.content))
          print(r.text[:12000])
          r.raise_for_status()
          PY

      - name: Upload failed raw source for parser repair
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-raw-source
          path: data/raw/**/failures/**
          if-no-files-found: ignore
          retention-days: 14
