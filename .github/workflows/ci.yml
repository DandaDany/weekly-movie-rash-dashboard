name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[test,browser]"

      - name: Run regression tests
        run: pytest -q

      - name: Live-check Malaysia + Singapore
        run: python scripts/run_cinema_online.py

      - name: Live-check Indonesia
        run: python scripts/run_cinepoint.py

      - name: Inspect Taiwan dataset metadata resources
        run: |
          python - <<'PY'
          import json
          import re
          import requests

          url = "https://data.gov.tw/api/v2/rest/dataset/94224"
          r = requests.get(url, headers={"User-Agent": "Mozilla/5.0"}, timeout=(10, 45))
          r.raise_for_status()
          result = r.json()["result"]
          print("TOP_KEYS", sorted(result.keys()))

          found = []
          def walk(value, path="result"):
              if isinstance(value, dict):
                  for key, child in value.items():
                      walk(child, f"{path}.{key}")
              elif isinstance(value, list):
                  for i, child in enumerate(value):
                      walk(child, f"{path}[{i}]")
              elif isinstance(value, str):
                  low = value.lower()
                  if (
                      "http" in low
                      or ".csv" in low
                      or ".json" in low
                      or "parameter" in path.lower()
                      or "resource" in path.lower()
                      or "oas" in path.lower()
                  ):
                      found.append((path, value))

          walk(result)
          for path, value in found:
              print("VALUE", path, value[:4000])
          print("FOUND_COUNT", len(found))

          # Also inspect likely machine-readable metadata variants exposed by data.gov.tw.
          for suffix in ["?format=json", "/dcat", "/rdf", "/history"]:
              probe = "https://data.gov.tw/api/v2/rest/dataset/94224" + suffix
              try:
                  rr = requests.get(probe, headers={"User-Agent": "Mozilla/5.0"}, timeout=(10, 30))
                  print("PROBE", probe, rr.status_code, rr.headers.get("content-type"), rr.text[:5000])
              except Exception as exc:
                  print("PROBE_ERROR", probe, type(exc).__name__, str(exc))
          PY

      - name: Upload failed raw source for parser repair
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-raw-source
          path: data/raw/**/failures/**
          if-no-files-found: ignore
          retention-days: 14
