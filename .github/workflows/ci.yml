name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[test]"

      - name: Run regression tests
        run: pytest -q

      - name: Live-check Cinema Online parser
        run: python scripts/run_cinema_online.py

      # Temporary P1 discovery step. Remove after the Cinepoint collector lands.
      - name: Diagnose Cinepoint Weekly browser interaction
        run: |
          pip install "playwright>=1.45,<2"
          python - <<'PY'
          import time
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch(channel="chrome", headless=True)
              page = browser.new_page(viewport={"width": 1440, "height": 1400})

              def on_response(response):
                  if "box-office" in response.url:
                      print("BOXOFFICE_RESPONSE", response.status, response.url)
                      try:
                          print("BOXOFFICE_BODY", response.text()[:8000])
                      except Exception as exc:
                          print("BOXOFFICE_BODY_ERROR", type(exc).__name__, str(exc))

              page.on("response", on_response)
              page.goto("https://cinepoint.com/", wait_until="domcontentloaded", timeout=90000)
              page.wait_for_timeout(5000)

              weekly = page.get_by_text("Weekly", exact=True)
              print("WEEKLY_COUNT", weekly.count())
              for i in range(weekly.count()):
                  locator = weekly.nth(i)
                  print(
                      "WEEKLY",
                      i,
                      "VISIBLE", locator.is_visible(),
                      "TAG", locator.evaluate("el => el.tagName"),
                      "CLASS", locator.get_attribute("class"),
                      "OUTER", locator.evaluate("el => el.outerHTML")[:2500],
                  )

              visible = next((weekly.nth(i) for i in range(weekly.count()) if weekly.nth(i).is_visible()), None)
              if visible is None:
                  raise RuntimeError("No visible Weekly tab")
              visible.click(timeout=30000)
              page.wait_for_timeout(10000)

              table = page.locator("table").first
              print("TABLE_AFTER_CLICK", table.inner_text()[:12000])
              print("HEADERS_AFTER_CLICK", [table.locator("th").nth(i).inner_text() for i in range(table.locator("th").count())])
              body_text = page.locator("body").inner_text()
              marker = body_text.find("Top Box Office")
              print("TBO_AFTER_CLICK", body_text[marker:marker + 5000] if marker >= 0 else body_text[:5000])
              browser.close()
          PY

      - name: Upload failed raw source for parser repair
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-raw-source
          path: data/raw/**/failures/**
          if-no-files-found: ignore
          retention-days: 14
