name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[test]"

      - name: Run regression tests
        run: pytest -q

      - name: Live-check Cinema Online parser
        run: python scripts/run_cinema_online.py

      # Temporary P1 discovery step. Remove after the Cinepoint collector lands.
      - name: Resolve Cinepoint TopBoxOffice endpoint constants
        run: |
          python - <<'PY'
          import requests

          headers = {"User-Agent": "Mozilla/5.0"}
          url = "https://cinepoint.com/chunk-TC6ZXBJ4.js"
          response = requests.get(url, timeout=(10, 45), headers=headers)
          response.raise_for_status()
          text = response.text
          print("CHUNK", response.status_code, len(response.content))

          for needle in ("TOP_BOX_OFFICE_PAGE", "TOP_BOX_OFFICE_DETAIL", "TOP_BOX_OFFICE:"):
              print("NEEDLE", needle, "COUNT", text.count(needle))
              start = 0
              for _ in range(min(10, text.count(needle))):
                  index = text.find(needle, start)
                  if index < 0:
                      break
                  print(text[max(0, index - 2200): index + 3200])
                  start = index + len(needle)
          PY

      - name: Upload failed raw source for parser repair
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-raw-source
          path: data/raw/**/failures/**
          if-no-files-found: ignore
          retention-days: 14
