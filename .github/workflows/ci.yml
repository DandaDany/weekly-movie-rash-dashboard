name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[test]"

      - name: Run regression tests
        run: pytest -q

      - name: Live-check Cinema Online parser
        run: python scripts/run_cinema_online.py

      # Temporary P1 discovery step. Remove after the Cinepoint collector lands.
      - name: Probe Cinepoint Weekly tab in browser
        run: |
          pip install "playwright>=1.45,<2"
          python -m playwright install --with-deps chromium
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 1440, "height": 1400})
              page.goto("https://cinepoint.com/", wait_until="domcontentloaded", timeout=90000)
              page.get_by_text("Weekly", exact=True).first.click(timeout=30000)
              page.locator("th", has_text="Weekly Adm.").wait_for(timeout=60000)

              print("URL", page.url)
              print("PERIOD_TEXT", page.get_by_text("Period:", exact=False).first.inner_text())
              table = page.locator("table").first
              print("TABLE_TEXT", table.inner_text()[:12000])
              rows = table.locator("tr")
              print("ROW_COUNT", rows.count())
              for i in range(min(rows.count(), 12)):
                  print("ROW", i, rows.nth(i).inner_text().replace("\n", " | "))
              print("TABLE_HTML", table.inner_html()[:20000])
              browser.close()
          PY

      - name: Upload failed raw source for parser repair
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-raw-source
          path: data/raw/**/failures/**
          if-no-files-found: ignore
          retention-days: 14
