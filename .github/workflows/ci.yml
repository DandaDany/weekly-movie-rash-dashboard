name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[test]"

      - name: Run regression tests
        run: pytest -q

      - name: Live-check Cinema Online parser
        run: python scripts/run_cinema_online.py

      # Temporary P1 discovery step. Remove after the Cinepoint collector lands.
      - name: Probe Cinepoint weekly ranking endpoint
        run: |
          python - <<'PY'
          import json
          import requests

          headers = {
              "User-Agent": "Mozilla/5.0",
              "Accept": "application/json, text/plain, */*",
              "Content-Type": "application/json",
              "Referer": "https://cinepoint.com/",
          }
          base = "https://cinepoint.com/bff/v1/home/box-office/weekly"
          variants = [
              {"type": "all", "limit": 10, "page": 0, "spinneroff": 1},
              {"type": "all", "limit": 10, "page": 1, "spinneroff": 1},
              {"type": "all", "rows": 10, "first": 0, "spinneroff": 1},
              {"type": "all", "spinneroff": 1},
          ]
          for params in variants:
              r = requests.get(base, params=params, headers=headers, timeout=(10, 45))
              print("URL", r.url)
              print("STATUS", r.status_code, "CONTENT_TYPE", r.headers.get("content-type"))
              print("BODY", r.text[:12000])
              print("---")
          PY

      - name: Upload failed raw source for parser repair
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-raw-source
          path: data/raw/**/failures/**
          if-no-files-found: ignore
          retention-days: 14
