name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[test,browser]"

      - name: Run regression tests
        run: pytest -q

      - name: Live-check Malaysia + Singapore
        run: python scripts/run_cinema_online.py

      - name: Live-check Indonesia
        run: python scripts/run_cinepoint.py

      - name: Diagnose Taiwan TFAI browser access and export
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright, TimeoutError as PlaywrightTimeoutError

          interesting = []
          with sync_playwright() as p:
              browser = p.chromium.launch(channel="chrome", headless=True)
              context = browser.new_context(
                  viewport={"width": 1440, "height": 1600},
                  locale="zh-TW",
                  timezone_id="Asia/Taipei",
              )
              page = context.new_page()

              def on_request(req):
                  low = req.url.lower()
                  if any(k in low for k in ["export", "json", "csv", "excel", "statistic", "download"]):
                      print("REQUEST", req.method, req.url)

              def on_response(resp):
                  low = resp.url.lower()
                  if any(k in low for k in ["export", "json", "csv", "excel", "statistic", "download"]):
                      print("RESPONSE", resp.status, resp.url, resp.headers.get("content-type"), resp.headers.get("content-disposition"))

              page.on("request", on_request)
              page.on("response", on_response)

              page.goto("https://boxofficetw.tfai.org.tw/", wait_until="domcontentloaded", timeout=90000)
              page.wait_for_timeout(5000)
              print("HOME_URL", page.url)
              print("HOME_TITLE", page.title())
              print("HOME_BODY", page.locator("body").inner_text()[:6000])
              anchors = page.locator("a")
              for i in range(anchors.count()):
                  a = anchors.nth(i)
                  text = a.inner_text().strip()
                  href = a.get_attribute("href")
                  if "票房" in text or (href and "statistic" in href.lower()):
                      print("HOME_LINK", text, href)

              page.goto("https://boxofficetw.tfai.org.tw/statistic", wait_until="domcontentloaded", timeout=90000)
              page.wait_for_timeout(5000)
              print("STAT_URL", page.url)
              print("STAT_TITLE", page.title())
              body = page.locator("body").inner_text()
              print("STAT_BODY", body[:12000])

              for label in ["Excel", "PDF", "JSON", "CSV"]:
                  loc = page.get_by_text(label, exact=True)
                  print("EXPORT_COUNT", label, loc.count())
                  for i in range(loc.count()):
                      el = loc.nth(i)
                      print("EXPORT_EL", label, i, el.evaluate("el => el.outerHTML")[:3000])

              json_loc = page.get_by_text("JSON", exact=True)
              if json_loc.count():
                  target = next((json_loc.nth(i) for i in range(json_loc.count()) if json_loc.nth(i).is_visible()), None)
                  if target is not None:
                      try:
                          with page.expect_download(timeout=10000) as info:
                              target.click(timeout=10000)
                          download = info.value
                          print("DOWNLOAD", download.suggested_filename)
                      except PlaywrightTimeoutError:
                          print("DOWNLOAD", "no-download-event")
                          page.wait_for_timeout(5000)
                          print("AFTER_JSON_URL", page.url)

              browser.close()
          PY

      - name: Upload failed raw source for parser repair
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-raw-source
          path: data/raw/**/failures/**
          if-no-files-found: ignore
          retention-days: 14
