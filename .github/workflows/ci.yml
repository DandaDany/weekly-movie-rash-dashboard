name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[test]"

      - name: Run regression tests
        run: pytest -q

      - name: Live-check Cinema Online parser
        run: python scripts/run_cinema_online.py

      # Temporary P1 discovery step. Remove after the Cinepoint collector lands.
      - name: Inspect Cinepoint TopBoxOffice module
        run: |
          python - <<'PY'
          import re
          import requests

          headers = {"User-Agent": "Mozilla/5.0"}
          url = "https://cinepoint.com/chunk-Q6ECZFTZ.js"
          response = requests.get(url, timeout=(10, 45), headers=headers)
          response.raise_for_status()
          text = response.text
          print("CHUNK", response.status_code, len(response.content))

          needles = ("top-box-office", "weekly", "monthly", "yearly", "/bff/", "/v1/")
          for needle in needles:
              print("NEEDLE", needle, "COUNT", text.lower().count(needle.lower()))
              start = 0
              for _ in range(min(12, text.lower().count(needle.lower()))):
                  index = text.lower().find(needle.lower(), start)
                  if index < 0:
                      break
                  print(text[max(0, index - 700): index + 1500])
                  start = index + len(needle)

          print("PATHS")
          candidates = sorted(set(re.findall(r'["\']([^"\']*(?:top-box-office|box-office)[^"\']*)["\']', text, flags=re.I)))
          for candidate in candidates:
              print(candidate)
          PY

      - name: Upload failed raw source for parser repair
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-raw-source
          path: data/raw/**/failures/**
          if-no-files-found: ignore
          retention-days: 14
