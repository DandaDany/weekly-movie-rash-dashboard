name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[test,browser]"

      - name: Run regression tests
        run: pytest -q

      - name: Live-check Malaysia + Singapore
        run: python scripts/run_cinema_online.py

      - name: Live-check Indonesia
        run: python scripts/run_cinepoint.py

      - name: Diagnose Taiwan official weekly data routes
        run: |
          python - <<'PY'
          import re
          import requests
          from bs4 import BeautifulSoup

          H = {"User-Agent": "Mozilla/5.0", "Accept": "application/json,text/html,text/csv,*/*"}

          # Known historical official weekly CSV, retained only as a route/access test.
          static_url = "https://opendata.culture.tw/upload/dataSource/2018-11-01/56b0d2a6-d688-4348-a033-e84fdba66f8f/c30e5ed7e0c14c0c269e1387e634b8ae.csv"
          r = requests.get(static_url, headers=H, timeout=(10, 45))
          print("STATIC", r.status_code, r.headers.get("content-type"), len(r.content), r.url)
          print("STATIC_HEAD", r.content[:1200])

          # Legacy OAS route: test only documented date-query semantics; no auth or bypass logic.
          oas = "https://opendata.culture.tw/openData/openApi/movie20200601"
          variants = [
              {},
              {"Start": "2026-07-27", "End": "2026-08-02"},
              {"start": "2026-07-27", "end": "2026-08-02"},
              {"startDate": "2026-07-27", "endDate": "2026-08-02"},
              {"StartDate": "2026-07-27", "EndDate": "2026-08-02"},
          ]
          for params in variants:
              try:
                  rr = requests.get(oas, params=params, headers=H, timeout=(10, 45))
                  print("OAS", rr.status_code, rr.headers.get("content-type"), rr.url, len(rr.content))
                  print("OAS_BODY", rr.text[:6000])
              except Exception as exc:
                  print("OAS_ERROR", params, type(exc).__name__, str(exc))

          # Inspect the official Culture open-data page and its own JS for resource/download routing.
          detail = "https://opendata.culture.tw/frontsite/openData/detail?datasetId=668"
          page = requests.get(detail, headers=H, timeout=(10, 45))
          print("DETAIL", page.status_code, page.url, len(page.content))
          page.raise_for_status()
          soup = BeautifulSoup(page.text, "html.parser")
          for tag in soup.find_all(["a", "button", "form"]):
              txt = " ".join(tag.stripped_strings)
              attrs = {k:v for k,v in tag.attrs.items() if k in {"href","action","onclick","id","class","data-url","data-id"}}
              s = (txt + " " + str(attrs)).lower()
              if any(k in s for k in ["download", "下載", "resource", "dataset", "openapi"]):
                  print("DETAIL_TAG", txt[:300], attrs)

          scripts = []
          for tag in soup.find_all("script", src=True):
              src = tag["src"]
              if src.startswith("//"):
                  src = "https:" + src
              elif src.startswith("/"):
                  src = "https://opendata.culture.tw" + src
              elif not src.startswith("http"):
                  src = "https://opendata.culture.tw/frontsite/openData/" + src
              scripts.append(src)
          print("SCRIPTS", scripts)
          for src in scripts:
              try:
                  js = requests.get(src, headers=H, timeout=(10, 30))
                  if js.status_code != 200:
                      continue
                  text = js.text
                  hits = [m.start() for m in re.finditer(r"download|resource|openapi|datasource|datasetid", text, re.I)]
                  if hits:
                      print("JS", src, "HITS", len(hits))
                      for pos in hits[:20]:
                          print(text[max(0,pos-700):pos+1800])
              except Exception as exc:
                  print("JS_ERROR", src, type(exc).__name__, str(exc))
          PY

      - name: Upload failed raw source for parser repair
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-raw-source
          path: data/raw/**/failures/**
          if-no-files-found: ignore
          retention-days: 14
