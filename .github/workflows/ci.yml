name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[test]"

      - name: Run regression tests
        run: pytest -q

      - name: Live-check Cinema Online parser
        run: python scripts/run_cinema_online.py

      # Temporary P1 discovery step. The public /statistic page returns 403 to
      # GitHub-hosted runners, so probe only the documented government OpenData
      # interfaces. Remove this step once the Taiwan collector is implemented.
      - name: Probe Taiwan OpenData interfaces
        run: |
          python - <<'PY'
          from pathlib import Path
          import requests

          targets = {
              "oas": "https://opendata.culture.tw/openData/openApi/movie20200601",
              "since2016": "https://boxofficetw.tfai.org.tw/OpenData/statistic/since2016",
          }
          headers = {"User-Agent": "Mozilla/5.0"}
          for name, url in targets.items():
              try:
                  response = requests.get(url, timeout=(10, 60), headers=headers)
                  print(name, "STATUS", response.status_code, "TYPE", response.headers.get("content-type"), "BYTES", len(response.content))
                  Path(f"taiwan-probe-{name}.txt").write_text(response.text, encoding="utf-8")
                  print(response.text[:4000])
              except Exception as exc:
                  print(name, "ERROR", type(exc).__name__, str(exc))
          PY

      - name: Upload Taiwan probe
        uses: actions/upload-artifact@v4
        with:
          name: taiwan-probe
          path: taiwan-probe-*.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload failed raw source for parser repair
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-raw-source
          path: data/raw/**/failures/**
          if-no-files-found: ignore
          retention-days: 14
