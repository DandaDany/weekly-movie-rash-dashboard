name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[test,browser]"

      - name: Run regression tests
        run: pytest -q

      - name: Live-check Malaysia + Singapore
        run: python scripts/run_cinema_online.py

      - name: Live-check Indonesia
        run: python scripts/run_cinepoint.py

      - name: Capture Taiwan current distribution list
        run: |
          python - <<'PY'
          import json
          import requests

          url = "https://opendata.culture.tw/frontsite/openData/findDetail"
          r = requests.get(
              url,
              params={"datasetId": 668},
              headers={"User-Agent": "Mozilla/5.0", "Accept": "application/json"},
              timeout=(10, 45),
          )
          payload = {
              "url": r.url,
              "status": r.status_code,
              "content_type": r.headers.get("content-type"),
              "length": len(r.content),
          }
          if r.ok:
              data = r.json()
              payload.update({
                  "title": data.get("title"),
                  "description": data.get("description"),
                  "publisher": data.get("publisher"),
                  "accrualperiodicity": data.get("accrualperiodicity"),
                  "issued": data.get("issued"),
                  "modifyDate": data.get("modifyDate"),
                  "distributionDetailList": data.get("distributionDetailList"),
              })
          else:
              payload["body_head"] = r.text[:5000]

          with open("taiwan-distribution-probe.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
          print(json.dumps({k:v for k,v in payload.items() if k != "distributionDetailList"}, ensure_ascii=False))
          PY

      - name: Upload Taiwan distribution probe
        uses: actions/upload-artifact@v4
        with:
          name: taiwan-distribution-probe
          path: taiwan-distribution-probe.json
          retention-days: 3

      - name: Upload failed raw source for parser repair
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-raw-source
          path: data/raw/**/failures/**
          if-no-files-found: ignore
          retention-days: 14
