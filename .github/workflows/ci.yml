name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[test,browser]"

      - name: Run regression tests
        run: pytest -q

      - name: Live-check Malaysia + Singapore
        run: python scripts/run_cinema_online.py

      - name: Live-check Indonesia
        run: python scripts/run_cinepoint.py

      - name: Probe Taiwan government open data API
        run: |
          python - <<'PY'
          import json
          import requests

          urls = [
              "https://data.gov.tw/api/v2/rest/dataset/94224",
              "https://data.nat.gov.tw/api/v2/rest/dataset/94224",
              "https://opendata.culture.tw/openData/openApi/movie20200601",
          ]
          headers = {"User-Agent": "Mozilla/5.0", "Accept": "application/json,text/plain,*/*"}
          for url in urls:
              try:
                  r = requests.get(url, headers=headers, timeout=(10, 45), allow_redirects=True)
                  print("URL", r.url)
                  print("STATUS", r.status_code, "TYPE", r.headers.get("content-type"), "LEN", len(r.content))
                  print("BODY", r.text[:30000])
              except Exception as exc:
                  print("ERROR", url, type(exc).__name__, str(exc))
              print("---")
          PY

      - name: Upload failed raw source for parser repair
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-raw-source
          path: data/raw/**/failures/**
          if-no-files-found: ignore
          retention-days: 14
