name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[test]"

      - name: Run regression tests
        run: pytest -q

      - name: Live-check Cinema Online parser
        run: python scripts/run_cinema_online.py

      # Temporary P1 discovery step. Remove after the Cinepoint collector lands
      # or is intentionally downgraded to a browser/DOM collector.
      - name: Inspect Cinepoint request interceptor
        run: |
          python - <<'PY'
          import re
          import requests

          headers = {"User-Agent": "Mozilla/5.0"}
          url = "https://cinepoint.com/chunk-TC6ZXBJ4.js"
          r = requests.get(url, headers=headers, timeout=(10, 45))
          r.raise_for_status()
          text = r.text

          needles = (
              "intercept(",
              "Authorization",
              "authorization",
              "api-key",
              "apiKey",
              "x-api",
              "X-API",
              "x-",
              "SHA256",
              "Dr(",
              "HttpInterceptor",
              "spinneroff",
              "response_output",
          )
          for needle in needles:
              print("###", needle, "COUNT", text.count(needle))
              start = 0
              for _ in range(min(20, text.count(needle))):
                  i = text.find(needle, start)
                  if i < 0:
                      break
                  print(text[max(0, i - 2400): i + 4200])
                  print("---")
                  start = i + len(needle)
          PY

      - name: Upload failed raw source for parser repair
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-raw-source
          path: data/raw/**/failures/**
          if-no-files-found: ignore
          retention-days: 14
