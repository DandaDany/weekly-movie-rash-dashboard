name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[test]"

      - name: Run regression tests
        run: pytest -q

      - name: Live-check Cinema Online parser
        run: python scripts/run_cinema_online.py

      # Temporary P1 discovery step. This is non-blocking and will be removed
      # once each remaining source has a production collector.
      - name: Probe remaining source connectivity and save Cinepoint assets
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests

          headers = {"User-Agent": "Mozilla/5.0"}
          targets = {
              "TW": "https://boxofficetw.tfai.org.tw/OpenData/statistic/since2016",
              "VN-v1": "https://v1.boxofficevietnam.com/",
              "VN-main": "https://boxofficevietnam.com/",
              "HK": "https://hkfilmart.hktdc.com/conference/hkfilmart/tc/hong-kong-weekly-box-office",
              "ID": "https://cinepoint.com/",
          }
          responses = {}
          for market, url in targets.items():
              try:
                  response = requests.get(url, timeout=(10, 45), headers=headers, allow_redirects=True)
                  responses[market] = response
                  title_match = re.search(r"<title[^>]*>(.*?)</title>", response.text, flags=re.I | re.S)
                  title = " ".join(title_match.group(1).split())[:160] if title_match else ""
                  print(market, "STATUS", response.status_code, "BYTES", len(response.content), "FINAL", response.url, "TITLE", title)
              except Exception as exc:
                  print(market, "ERROR", type(exc).__name__, str(exc))

          cine = responses.get("ID")
          if cine is not None and cine.status_code == 200:
              asset_dir = Path("discovery/cinepoint")
              asset_dir.mkdir(parents=True, exist_ok=True)
              asset_dir.joinpath("index.html").write_text(cine.text, encoding="utf-8")

              scripts = re.findall(r'<script[^>]+src=["\']([^"\']+)', cine.text, flags=re.I)
              print("CINEPOINT_SCRIPTS", len(scripts))
              for src in scripts:
                  js_url = urljoin(cine.url, src)
                  print("SCRIPT", js_url)
                  if "cinepoint.com" not in js_url:
                      continue
                  try:
                      response = requests.get(js_url, timeout=(10, 60), headers=headers)
                      response.raise_for_status()
                  except Exception as exc:
                      print("JS_ERROR", js_url, type(exc).__name__, str(exc))
                      continue
                  filename = js_url.rsplit("/", 1)[-1].split("?", 1)[0] or "asset.js"
                  asset_dir.joinpath(filename).write_text(response.text, encoding="utf-8")
                  print("SAVED", filename, len(response.content))
          PY

      - name: Upload Cinepoint discovery assets
        uses: actions/upload-artifact@v4
        with:
          name: cinepoint-discovery
          path: discovery/cinepoint/
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload failed raw source for parser repair
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-raw-source
          path: data/raw/**/failures/**
          if-no-files-found: ignore
          retention-days: 14
