name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[test]"

      - name: Run regression tests
        run: pytest -q

      - name: Live-check Cinema Online parser
        run: python scripts/run_cinema_online.py

      # Temporary P1 discovery step. Read Cinepoint's server-rendered Angular
      # transfer state instead of crawling minified/lazy JavaScript chunks.
      - name: Inspect Cinepoint TBO SSR requests
        run: |
          python - <<'PY'
          import re
          import requests

          headers = {"User-Agent": "Mozilla/5.0"}
          for page_url in ("https://cinepoint.com/", "https://cinepoint.com/pages/tbo"):
              response = requests.get(page_url, timeout=(10, 45), headers=headers)
              response.raise_for_status()
              print("PAGE", page_url, response.status_code, len(response.content))
              urls = sorted(set(re.findall(r'"u":"([^"]+)"', response.text)))
              for value in urls:
                  if any(key in value.lower() for key in ("box-office", "tbo", "movie")):
                      print("SSR", value)

          # Verify same-origin BFF routes directly. These are public GETs used by
          # the Cinepoint frontend; no authentication or browser automation.
          for period in ("daily", "weekly", "monthly", "yearly"):
              url = f"https://cinepoint.com/bff/v1/home/box-office/{period}?limit=10&page=0&type=all"
              response = requests.get(url, timeout=(10, 45), headers=headers)
              print("BFF", period, response.status_code, response.headers.get("content-type"), len(response.content), response.text[:800])
          PY

      - name: Upload failed raw source for parser repair
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-raw-source
          path: data/raw/**/failures/**
          if-no-files-found: ignore
          retention-days: 14
