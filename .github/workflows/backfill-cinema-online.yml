name: Backfill Cinema Online history

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date (YYYY-MM-DD)"
        required: true
        default: "2026-01-01"
      end_date:
        description: "End date (YYYY-MM-DD)"
        required: true
  # One-time P1 bootstrap trigger. Remove after the 2026 history seed succeeds.
  push:
    branches:
      - agent/p1-data-pipeline
    paths:
      - ".github/workflows/backfill-cinema-online.yml"

permissions:
  contents: write

concurrency:
  group: boxoffice-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install and test
        run: |
          pip install -e ".[test]"
          pytest -q

      - name: Resolve backfill range
        id: range
        shell: bash
        run: |
          START_DATE="${{ inputs.start_date }}"
          END_DATE="${{ inputs.end_date }}"
          if [ -z "$START_DATE" ]; then START_DATE="2026-01-01"; fi
          if [ -z "$END_DATE" ]; then END_DATE="2026-08-09"; fi
          echo "start=$START_DATE" >> "$GITHUB_OUTPUT"
          echo "end=$END_DATE" >> "$GITHUB_OUTPUT"
          echo "Backfill range: $START_DATE -> $END_DATE"

      - name: Backfill MY/SG
        run: >-
          python scripts/backfill_cinema_online.py
          --start "${{ steps.range.outputs.start }}"
          --end "${{ steps.range.outputs.end }}"

      # Intentionally no `if: always()`: an incomplete backfill must not be committed.
      - name: Commit successful backfill data
        run: |
          if git diff --quiet; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public
          git commit -m "data: backfill Cinema Online 2026 history"
          git push
