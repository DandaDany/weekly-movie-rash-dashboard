name: Backfill Cinema Online history

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date (YYYY-MM-DD)"
        required: true
        default: "2026-01-01"
      end_date:
        description: "End date (YYYY-MM-DD)"
        required: true

permissions:
  contents: write

concurrency:
  group: boxoffice-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install and test
        run: |
          pip install -e ".[test]"
          pytest -q

      - name: Backfill MY/SG
        run: >-
          python scripts/backfill_cinema_online.py
          --start "${{ inputs.start_date }}"
          --end "${{ inputs.end_date }}"

      - name: Commit successful backfill data
        if: always()
        run: |
          if git diff --quiet; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public
          git commit -m "data: backfill Cinema Online history"
          git push
